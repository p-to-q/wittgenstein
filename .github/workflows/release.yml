name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Release identity regression tests
        run: pnpm test:release

      - name: Build public CLI
        run: pnpm release:npm-cli

      - name: Verify tag, packed CLI, source and public npm artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          pnpm release:check --tag "$RELEASE_TAG" --require-npm

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Mark anything with a hyphen (alpha/beta/rc/pre) as prerelease.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pull the section between [VERSION] and the next top-level "## [" heading.
          # Uses index() literal-string match instead of regex so brackets in
          # the version (e.g. "[0.2.0-alpha.1]") are not interpreted as a
          # character class. This is the bug that bit v0.2.0-alpha.1's first
          # publish — the regex "^## [0.2.0-alpha.1]" matched every `## [...]`
          # heading because `[0.2-alpha1]` parsed as a char class.
          awk -v marker="## [$VERSION]" '
            index($0, marker) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > .release-notes.md
          if [ ! -s .release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION; falling back to autogen." >&2
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: ${{ steps.changelog.outputs.fallback == 'true' }}
          body_path: ${{ steps.changelog.outputs.fallback == 'true' && '' || '.release-notes.md' }}
