name: Markdown link check

# Monthly link check across docs surfaces. Files an issue if broken
# links are detected. Manual dispatch supported for one-off runs.
#
# Runs on the 1st of each month at 02:00 UTC. Off-hours, low-noise.

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run lychee link check
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Pin the bundled lychee binary explicitly. The action's default
          # version drifts with new releases: v0.24 removed `--exclude-mail`
          # (mail is now excluded by default) and the drift silently broke
          # this workflow in 2026 — see #584. Bump deliberately.
          lycheeVersion: v0.24.2
          # Slightly above lychee defaults (retry wait 1s, timeout 20s) so
          # transient slow hosts don't fail the monthly audit; real breakage
          # still surfaces. Baseline run: #584.
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --exclude-loopback
            --exclude-path '.*node_modules.*'
            --accept 200..=299,403,429
            'docs/**/*.md'
            'README.md'
            'AGENTS.md'
            'PROMPT.md'
            'CONTRIBUTING.md'
            'CHANGELOG.md'
          fail: false
          format: markdown
          output: ./lychee/out.md

      - name: Reuse existing issue or open a new one if broken
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const title = "[docs] monthly link check found broken links";
            const body = fs.readFileSync("./lychee/out.md", "utf8");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "documentation",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `## Monthly link-check update\n\n${body}`,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["documentation"],
              });
              core.info("Opened new monthly link-check issue");
            }
